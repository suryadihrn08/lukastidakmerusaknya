<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin · Lukas</title><link rel="stylesheet" href="style.css"></head><body>
<main class="admin-layout"><a class="back" href="./">← Kembali ke website</a><h1>Admin Lukas</h1><p id="notice" role="status"></p>
<form id="loginForm" class="admin-card"><h2>Masuk</h2><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Masuk</button></form>
<section id="dashboard" hidden><button id="logout" type="button">Keluar</button><form id="postForm" class="admin-card"><h2>Posting momen</h2><label>Cerita / caption<textarea id="caption" rows="5" maxlength="5000" placeholder="Cerita hari ini..."></textarea></label><label>Foto atau video (opsional, maks. 50 MB)<input type="file" id="media" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label><button type="submit" id="publish">Terbitkan</button></form><h2>Postingan terbaru</h2><div id="adminPosts"></div></section></main>
<script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
